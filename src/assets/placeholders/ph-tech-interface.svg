<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <!-- Solu1ions placeholder — Technology & Digital Solutions.
       Built once, built properly: an interface, its code, and the system behind it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/>
      <stop offset="0.55" stop-color="#232c44"/>
      <stop offset="1" stop-color="#0f121b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- fine grid -->
  <g stroke="#4a5d7a" stroke-width="1" opacity="0.22">
    <path d="M128 0V640M256 0V640M384 0V640M512 0V640"/>
    <path d="M0 128H640M0 256H640M0 384H640M0 512H640"/>
  </g>

  <!-- corner language -->
  <path d="M560 40h40v40" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.55"/>
  <path d="M80 600H40v-40" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.55"/>
  <path d="M52 76l14-24h44l-14 24z" fill="#c9144b" opacity="0.9"/>

  <!-- interface window -->
  <g stroke-width="2">
    <rect x="104" y="128" width="312" height="248" fill="#0f121b" fill-opacity="0.55" stroke="#f2f2f2" opacity="0.85"/>
    <path d="M104 168h312" stroke="#f2f2f2" opacity="0.6"/>
    <circle cx="128" cy="148" r="5" fill="#c9144b" stroke="none"/>
    <circle cx="148" cy="148" r="5" fill="#8ea0bb" stroke="none"/>
    <circle cx="168" cy="148" r="5" fill="#f2f2f2" fill-opacity="0.6" stroke="none"/>
  </g>

  <!-- code lines -->
  <g stroke-width="8" stroke-linecap="square">
    <path d="M132 200h96" stroke="#8ea0bb" opacity="0.8"/>
    <path d="M156 226h148" stroke="#f2f2f2" opacity="0.55"/>
    <path d="M156 252h72" stroke="#c9144b" opacity="0.9"/>
    <path d="M156 278h120" stroke="#8ea0bb" opacity="0.6"/>
    <path d="M132 304h84" stroke="#f2f2f2" opacity="0.4"/>
    <path d="M132 330h56" stroke="#8ea0bb" opacity="0.8"/>
  </g>
  <rect x="200" y="322" width="16" height="16" fill="#c9144b"/>

  <!-- system graph behind the interface -->
  <g fill="none" stroke="#8ea0bb" stroke-width="2" opacity="0.7">
    <path d="M416 232h72v-64h48M416 300h104v88h-40M488 168v-40M520 388v72"/>
  </g>
  <g fill="#0f121b" stroke="#f2f2f2" stroke-width="2">
    <circle cx="488" cy="128" r="8"/>
    <circle cx="536" cy="168" r="8"/>
    <circle cx="480" cy="388" r="8"/>
  </g>
  <circle cx="520" cy="460" r="10" fill="#c9144b"/>

  <!-- foundation slab -->
  <rect x="104" y="440" width="248" height="72" fill="none" stroke="#8ea0bb" stroke-width="2" opacity="0.6"/>
  <path d="M128 476h120" stroke="#8ea0bb" stroke-width="2" opacity="0.7"/>
  <rect x="272" y="464" width="56" height="24" fill="#c9144b" opacity="0.55"/>
</svg>
