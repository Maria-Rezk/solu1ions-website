<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <!-- Solu1ions placeholder — Marketing & Communications.
       One source, widening signal, an audience that answers back. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/>
      <stop offset="0.55" stop-color="#232c44"/>
      <stop offset="1" stop-color="#0f121b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- fine grid -->
  <g stroke="#4a5d7a" stroke-width="1" opacity="0.22">
    <path d="M128 0V640M256 0V640M384 0V640M512 0V640"/>
    <path d="M0 128H640M0 256H640M0 384H640M0 512H640"/>
  </g>

  <!-- corner language -->
  <path d="M560 40h40v40" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.55"/>
  <path d="M80 600H40v-40" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.55"/>
  <path d="M52 76l14-24h44l-14 24z" fill="#c9144b" opacity="0.9"/>

  <!-- broadcast origin -->
  <circle cx="168" cy="472" r="14" fill="#c9144b"/>
  <circle cx="168" cy="472" r="26" fill="none" stroke="#c9144b" stroke-width="2" opacity="0.5"/>

  <!-- widening signal arcs -->
  <g fill="none" stroke-width="2.5">
    <path d="M226 414a82 82 0 0 0-24-24" stroke="#f2f2f2" opacity="0.85"/>
    <path d="M282 358a162 162 0 0 0-80-80" stroke="#8ea0bb" opacity="0.75"/>
    <path d="M338 302a241 241 0 0 0-136-136" stroke="#8ea0bb" opacity="0.5"/>
    <path d="M394 246a320 320 0 0 0-192-192" stroke="#4a5d7a" opacity="0.45"/>
  </g>

  <!-- audience nodes catching the signal -->
  <g fill="#0f121b" stroke="#f2f2f2" stroke-width="2">
    <circle cx="300" cy="215" r="7"/>
    <circle cx="392" cy="330" r="7"/>
    <circle cx="252" cy="130" r="7"/>
  </g>
  <circle cx="448" cy="180" r="9" fill="#c9144b"/>

  <!-- messages returning: channel chips -->
  <g stroke-width="2">
    <rect x="404" y="404" width="148" height="44" fill="none" stroke="#f2f2f2" opacity="0.7"/>
    <path d="M424 426h108" stroke="#8ea0bb"/>
    <rect x="452" y="472" width="100" height="44" fill="none" stroke="#8ea0bb" opacity="0.6"/>
    <path d="M472 494h60" stroke="#8ea0bb"/>
    <rect x="380" y="540" width="172" height="44" fill="#c9144b" opacity="0.55"/>
    <path d="M400 562h132" stroke="#f2f2f2" opacity="0.9"/>
  </g>
</svg>
