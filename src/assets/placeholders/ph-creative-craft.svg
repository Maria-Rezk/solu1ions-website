<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <!-- Solu1ions placeholder — Visual Communication & Creative Production.
       The drawing board: a curve under construction, crop marks, a working palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/>
      <stop offset="0.55" stop-color="#232c44"/>
      <stop offset="1" stop-color="#0f121b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- fine grid -->
  <g stroke="#4a5d7a" stroke-width="1" opacity="0.22">
    <path d="M128 0V640M256 0V640M384 0V640M512 0V640"/>
    <path d="M0 128H640M0 256H640M0 384H640M0 512H640"/>
  </g>

  <!-- crop marks -->
  <g stroke="#f2f2f2" stroke-width="2" opacity="0.55">
    <path d="M560 40h40v40"/>
    <path d="M80 600H40v-40"/>
    <path d="M80 40H40v40"/>
    <path d="M560 600h40v-40"/>
  </g>
  <path d="M52 76l14-24h44l-14 24z" fill="#c9144b" opacity="0.9"/>

  <!-- composition study: circle and rotated frame -->
  <circle cx="330" cy="270" r="150" fill="none" stroke="#8ea0bb" stroke-width="2" opacity="0.55"/>
  <rect x="230" y="170" width="200" height="200" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.4" transform="rotate(12 330 270)"/>

  <!-- bezier under construction, with control handles -->
  <path d="M140 420 C 230 300, 330 460, 420 300 S 520 180, 520 180" fill="none" stroke="#f2f2f2" stroke-width="2.5" opacity="0.9"/>
  <g stroke="#c9144b" stroke-width="1.5" opacity="0.85">
    <path d="M140 420L230 300M420 300L500 232"/>
  </g>
  <g fill="#0f121b" stroke="#f2f2f2" stroke-width="2">
    <rect x="134" y="414" width="12" height="12"/>
    <rect x="414" y="294" width="12" height="12"/>
  </g>
  <g fill="#c9144b">
    <circle cx="230" cy="300" r="6"/>
    <circle cx="500" cy="232" r="6"/>
  </g>

  <!-- working palette -->
  <g stroke-width="2">
    <rect x="140" y="504" width="56" height="56" fill="#c9144b"/>
    <rect x="212" y="504" width="56" height="56" fill="#2b344f" stroke="#8ea0bb"/>
    <rect x="284" y="504" width="56" height="56" fill="none" stroke="#f2f2f2" opacity="0.8"/>
  </g>
  <path d="M372 532h128" stroke="#8ea0bb" stroke-width="2" opacity="0.7"/>
  <path d="M372 552h92" stroke="#8ea0bb" stroke-width="2" opacity="0.5"/>
</svg>
